    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- iOS PWA (Android/Windows read the manifest instead; these tags are inert there) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GRIND">

    <!-- iOS splash screens: Safari does not derive these from the manifest like
         Android/Windows do, so each supported screen needs an explicit image. -->

          media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
